<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>KORIX3D Worker</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f5f5f5;background:#080808;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,rgba(255,106,0,.16),transparent 34rem),#080808}main{width:min(1500px,100%);margin:auto;padding:24px}.hero,.panel,.stat,.row{border:1px solid #242424;background:rgba(20,20,20,.84);box-shadow:0 18px 50px rgba(0,0,0,.2)}.hero{position:relative;overflow:hidden;padding:28px;border-radius:28px;background:linear-gradient(135deg,#171717,#080808 65%,#301303)}.brand{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ff6a00;color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1;margin:18px 0 10px}.orange{color:#ff7900}.muted{color:#939393}.small{font-size:12px}.connection{display:flex;align-items:center;gap:12px;margin-top:22px}.dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;box-shadow:0 0 18px currentColor}.dot.online{background:#22c55e}.dot.error{background:#ef4444}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button,a.button{appearance:none;border:1px solid #343434;border-radius:12px;background:#1d1d1d;color:#fff;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}button.primary{border-color:#ff6a00;background:#ff6a00}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:18px;border-radius:18px}.stat strong{display:block;margin-top:9px;font-size:28px}.stat span{font-size:12px;color:#929292}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{border-radius:22px;padding:19px;min-width:0}.panel h2{margin:0 0 14px;font-size:18px}.list{display:grid;gap:9px;max-height:550px;overflow:auto}.row{padding:14px;border-radius:14px;box-shadow:none}.line{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:800}.pill{display:inline-flex;border:1px solid #3b3b3b;border-radius:99px;padding:4px 8px;font-size:11px;white-space:nowrap}.pill.paid,.pill.completed{border-color:#14532d;background:#052e16;color:#86efac}.pill.pending,.pill.processing{border-color:#713f12;background:#271505;color:#fde68a}.pill.failed,.pill.refunded{border-color:#7f1d1d;background:#2b0909;color:#fca5a5}.details{margin-top:7px;color:#aaa;font-size:12px}.empty{padding:34px;text-align:center;color:#777;border:1px dashed #333;border-radius:14px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:16px;color:#666;font-size:11px}@media(max-width:900px){main{padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{padding:22px}.footer{flex-direction:column}}@media(max-width:430px){.stat strong{font-size:22px}.stats{gap:8px}.stat{padding:14px}.actions>*{width:100%;text-align:center}}
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <span class="brand">KORIX3D WORKER</span>
      <h1>Centrum <span class="orange">produkcji</span></h1>
      <p class="muted">Lokalny, bezpieczny podgląd Creality Print i zamówień z korix3d.pl.</p>
      <div class="connection"><span id="dot" class="dot"></span><div><strong id="runtime-title">Uruchamianie workera…</strong><div id="runtime-detail" class="muted small">Sprawdzanie konfiguracji</div></div></div>
      <div class="actions"><button id="refresh" class="primary">Odśwież dane</button><a class="button" href="https://korix3d.pl/admin/produkcja" target="_blank" rel="noreferrer">Otwórz panel online</a></div>
    </header>
    <section id="stats" class="stats"></section>
    <section class="grid">
      <div class="panel"><h2>Ostatnie kalkulacje</h2><div id="calculations" class="list"></div></div>
      <div class="panel"><h2>Zamówienia sklepu</h2><div id="orders" class="list"></div></div>
    </section>
    <footer class="footer"><span id="synced">Brak synchronizacji</span><span>Dostęp tylko z tego komputera · 127.0.0.1</span></footer>
  </main>
  <script>
    const $=id=>document.getElementById(id);const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));const money=value=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(Number(value)||0);const formatDate=value=>value?new Date(value).toLocaleString('pl-PL'):'—';const calcLabel={pending:'Oczekuje',processing:'Liczenie',completed:'Gotowa',failed:'Błąd',cancelled:'Anulowana'};const orderLabel={pending:'Nieopłacone',paid:'Opłacone',processing:'W realizacji',shipped:'Wysłane',delivered:'Dostarczone',cancelled:'Anulowane',refunded:'Zwrócone'};
    function relationNumber(item){const relation=Array.isArray(item.orders_3d)?item.orders_3d[0]:item.orders_3d;return relation?.order_number||String(item.order_id||'').slice(0,8).toUpperCase()}
    function render(payload){const runtime=payload.runtime||{};const overview=payload.overview||{};const status=runtime.status||'starting';$('dot').className='dot '+(status==='idle'||status==='processing'?'online':status==='blocked'||status==='error'?'error':'');$('runtime-title').textContent=status==='idle'?'Worker gotowy':status==='processing'?'Trwa kalkulacja':status==='blocked'?'Creality Print zablokowany':status==='error'?'Błąd workera':'Uruchamianie workera…';$('runtime-detail').textContent=runtime.last_error||runtime.current_job_name||'Połączono z KORIX3D';const summary=overview.summary||{};const stats=[['Aktywna produkcja',summary.open_production_orders],['Kalkulacje w kolejce',(summary.pending_calculations||0)+(summary.processing_calculations||0)],['Opłacone zamówienia',summary.paid_store_orders],['Wartość opłaconych',money(summary.paid_store_value)]];$('stats').innerHTML=stats.map(([label,value])=>`<article class="stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value??0)}</strong></article>`).join('');const calculations=overview.calculations||[];$('calculations').innerHTML=calculations.length?calculations.slice(0,20).map(item=>{const result=item.result||{};const seconds=Number(result.printing_time_seconds)||0;const time=seconds?`${(seconds/3600).toFixed(2)} h`:'—';const grams=Number(result.filament_used_grams)||0;return `<article class="row"><div class="line"><span class="title">${escapeHtml(relationNumber(item))}</span><span class="pill ${escapeHtml(item.status)}">${escapeHtml(calcLabel[item.status]||item.status)}</span></div><div class="details">${escapeHtml(item.input_file?.name||`Plik ${Number(item.file_index)+1}`)} · ${escapeHtml(item.material_name||'Materiał')} · ${escapeHtml(item.color||'kolor')} · ${escapeHtml(item.infill_percent)}%</div><div class="details">${escapeHtml(time)} · ${escapeHtml(grams?grams.toFixed(2)+' g':'—')}</div></article>`}).join(''):'<div class="empty">Brak kalkulacji</div>';const orders=overview.store_orders||[];$('orders').innerHTML=orders.length?orders.slice(0,20).map(item=>`<article class="row"><div class="line"><span class="title">${escapeHtml(item.order_number)}</span><span class="pill ${escapeHtml(item.payment_state)}">${escapeHtml(orderLabel[item.status]||item.status)}</span></div><div class="details">${escapeHtml(item.customer_name||'Klient sklepu')} · ${escapeHtml(formatDate(item.created_at))}</div><div class="details">Netto ${escapeHtml(money(item.net_total))} · Brutto ${escapeHtml(money(item.total))}</div></article>`).join(''):'<div class="empty">Brak zamówień sklepu</div>';$('synced').textContent='Synchronizacja: '+formatDate(overview.checked_at)}
    async function load(){const button=$('refresh');button.disabled=true;try{const response=await fetch('/api/state',{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Brak połączenia');render(data)}catch(error){$('runtime-title').textContent='Brak połączenia';$('runtime-detail').textContent=error.message;$('dot').className='dot error'}finally{button.disabled=false}}$('refresh').addEventListener('click',load);load();setInterval(()=>{if(document.visibilityState==='visible')load()},15000);
  </script>
</body>
</html>
