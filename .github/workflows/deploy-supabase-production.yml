name: Deploy Supabase Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Wpisz deploy-production po wykonaniu backupu i teście stagingu'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: korix3d-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'deploy-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database and security contract
        run: npm run check:supabase

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration plan
        run: supabase migration list --linked

      - name: Apply pending migrations
        run: supabase db push --linked --include-all

      - name: Deploy authenticated Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify migration state
        run: supabase migration list --linked
