name: Korix3D CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korix3d-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Environment contract check
        run: npm run check:env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Supabase production contract
        run: npm run check:supabase

      - name: Stripe production contract
        run: npm run check:stripe

      - name: Vercel production contract
        run: npm run check:vercel

      - name: Domain production contract
        run: npm run check:domain

      - name: Monitoring production contract
        run: npm run check:monitoring

      - name: Operations documentation check
        run: npm run check:docs

      - name: Production build
        run: npm run build

      - name: JavaScript budget check
        run: npm run check:bundle

      - name: Production smoke test
        run: npm run test:smoke

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:prebuilt

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
